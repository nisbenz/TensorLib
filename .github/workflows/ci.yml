name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    container: alpine:3.20
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: apk add --no-cache build-base clang cmake openmp-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DTENSORLIB_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Test installed package
        run: |
          cmake --install build --prefix "$PWD/install"
          cmake -S tests/integration/package_consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-consumer --parallel 2
          ctest --test-dir build-consumer --output-on-failure

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTENSORLIB_ENABLE_OPENMP=OFF
          -DTENSORLIB_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  portable:
    name: macOS (serial)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTENSORLIB_ENABLE_OPENMP=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  windows:
    name: Windows (MinGW)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTENSORLIB_ENABLE_OPENMP=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
